<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kith</title>
<script>
  // Set the theme before first paint so the page does not flash the wrong colours.
  (function () {
    let t = null;
    try { t = localStorage.getItem('kith_theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Kith</h1>
    <span class="tagline">the friends in our orbit</span>
  </div>
  <div class="actions">
    <button class="btn" disabled title="Logging chats arrives in milestone 3">+ log a chat</button>
    <button class="btn btn-ghost" id="theme-toggle" aria-label="Toggle light and dark theme"></button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="Search, tags and people">
    <input class="search" id="search" type="search" placeholder="find someone…" aria-label="Search people, tags and notes" />
    <section class="side-section">
      <h3>Tags <button class="mini" id="clear-tags" hidden>clear</button></h3>
      <div class="tag-list" id="tag-list"></div>
    </section>
    <section class="side-section reach-section">
      <h3>Reach out today <button class="mini" id="reach-shuffle">shuffle</button></h3>
      <ul class="people-list" id="reach-list"></ul>
    </section>
    <section class="side-section people-section">
      <h3>People <span class="count" id="people-count"></span></h3>
      <ul class="people-list" id="people-list"></ul>
    </section>
  </aside>

  <main class="stage">
    <div class="sky-wrap"><svg id="sky" role="img" aria-label="Constellation of people"></svg></div>
    <aside id="panel" class="panel"><div class="panel-inner"></div></aside>
  </main>
</div>

<footer class="legend" id="legend"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
